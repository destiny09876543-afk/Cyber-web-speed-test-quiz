<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="navbar">
    <a class="logo" href="#">DQuiz</a>
    <nav>
      <a href="#">About</a>
      <a href="#">Contact us</a>
    </nav>
  </header>

  <main class="page">

    <section id="start-screen" class="start-card">
      <h1>Cyber &amp; Web Speed Test</h1>
      <p>by Odeh Destiny</p>
      <button type="button" id="start-btn" class="start-btn">Start</button>
    </section>

    <section id="quiz-screen" hidden>
      <p id="timer"></p>
      <h1 style="text-align: center; color: #0b57d0;">Cyber &amp; Web Quiz</h1>
      <form id="options-form">
        <p id="progress-text"></p>
        <p id="question"></p>
        <div id="options"></div>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section id="result-screen" hidden>
      <h1>Your result</h1>
      <div class="score-card">
        <p id="score"></p>
        <p id="message"></p>
      </div>
      <h2>Review</h2>
      <div id="review"></div>
      <button type="button" id="restart-btn">Try again</button>
    </section>

  <script src="script.js"></script>
</body>
</html>


  <script src="script.js"></script>
</body>
</html>
